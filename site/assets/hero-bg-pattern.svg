      <stop offset="0%" stop-color="#081426"/>
      <stop offset="55%" stop-color="#0b1d3a"/>
      <stop offset="100%" stop-color="#0a1830"/>
    </linearGradient>
    <pattern id="netpattern" x="0" y="0" width="240" height="240" patternUnits="userSpaceOnUse">
      <g stroke="#28477f" stroke-width="1" opacity="0.5">
        <line x1="20" y1="30" x2="90" y2="70"/>
        <line x1="90" y1="70" x2="60" y2="140"/>
        <line x1="60" y1="140" x2="130" y2="160"/>
        <line x1="20" y1="30" x2="60" y2="140"/>
        <line x1="150" y1="20" x2="200" y2="80"/>
