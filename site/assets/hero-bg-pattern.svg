      <g fill="#3b82f6">
        <circle cx="20" cy="30" r="2.4"/>
        <circle cx="90" cy="70" r="1.8"/>
        <circle cx="60" cy="140" r="2.2"/>
        <circle cx="130" cy="160" r="1.8"/>
        <circle cx="150" cy="20" r="2.2"/>
